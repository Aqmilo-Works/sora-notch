<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="notice.css"><title>Sora notification</title><script src="no-tooltips.js"></script></head>
<body><svg id="join" aria-hidden="true"><path id="neck"/></svg><main id="capsule" role="status" aria-live="polite">
  <div class="notice-body">
    <div class="badge" aria-hidden="true">
      <!-- The Mac's own reminder icons (a connected hourglass with its sand); the agent's and the recorder's as on Windows. -->
      <svg class="timer" viewBox="0 0 32 32"><path d="M8 4h16M8 28h16M10 5v4c0 4 3 5 6 7-3 2-6 3-6 7v4m12-22v4c0 4-3 5-6 7 3 2 6 3 6 7v4"/><path class="sand" d="M12 9h8l-4 4zm0 16 4-4 4 4z"/></svg>
      <svg class="event" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="20" rx="4"/><path d="M5 13h22M11 4v6M21 4v6m-9 10 3 3 5-6"/></svg>
      <svg class="water" viewBox="0 0 32 32"><path d="M16 4c5 6 8 10 8 15a8 8 0 0 1-16 0c0-5 3-9 8-15z"/><path d="M12 20a4 4 0 0 0 4 4"/></svg>
      <svg class="alarm" viewBox="0 0 32 32"><circle cx="16" cy="17" r="9"/><path d="M16 12v5l3 2M5 8l4-3m18 3-4-3"/></svg>
      <svg class="agent" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8ZM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8Z"/></svg>
      <svg class="receive" viewBox="0 0 24 24"><path d="M9 2.5h6a2.5 2.5 0 0 1 2.5 2.5v14a2.5 2.5 0 0 1-2.5 2.5H9A2.5 2.5 0 0 1 6.5 19V5A2.5 2.5 0 0 1 9 2.5ZM12 7.5v7m-3-3 3 3 3-3M10.5 18h3"/></svg>
      <svg class="meeting" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3ZM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </div>
    <div class="copy"><h1 id="title"></h1><p id="detail"></p></div>
    <span class="pct" aria-hidden="true"></span>
    <svg class="life" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5"/><circle class="count" cx="9" cy="9" r="6.5" pathLength="1"/></svg>
  </div>
  <!-- LocalSend: Deny / Accept under the words, or the transfer's bar. -->
  <div class="acts" hidden><button type="button" class="deny">Deny</button><button type="button" class="accept">Accept</button></div>
  <div class="meter" hidden><i></i></div>
</main><script type="module" src="notice.js"></script></body></html>
