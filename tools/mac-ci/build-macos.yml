# Builds Sora for macOS on GitHub's Mac runners: one Sora.dmg for Apple silicon and Intel (ad-hoc signed, not
# notarized), uploaded as the run's artifact. Copy of the private build repo's .github/workflows/build-macos.yml.
# Meeting and the chat apps are not offered on macOS, so nothing beside Sora itself is built.
name: Build Sora for macOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOS_MIN: "12.0"

jobs:

  dmg:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Not with CI=true: the bundler then skips the Finder step that lays out the install window (background, icon
      # places), and the .dmg opens as a plain folder.
      - name: Build Sora.app and Sora.dmg (universal)
        run: |
          unset CI
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Sora-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked
